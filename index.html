<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kenjishi Limited | Tech Strategy & Enterprise Architecture</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            max-width: 600px;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.05em;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .logo span {
            color: var(--accent);
        }

        .tagline {
            font-size: 1.25rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-weight: 300;
        }

        .divider {
            height: 1px;
            width: 50px;
            background-color: var(--accent);
            margin: 0 auto 2rem auto;
        }

        .status {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }

        .info {
            font-size: 1rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .contact {
            margin-top: 2rem;
            font-size: 0.95rem;
        }

        .contact a {
            color: var(--accent);
            text-decoration: none;
        }

        .contact a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="status">Coming Soon</div>
        <h1 class="logo">Kenjishi<span>.com</span></h1>
        <div class="tagline">Technology Strategy & Enterprise Architecture</div>
        
        <div class="divider"></div>
        
        <p class="info">
            Kenjishi Limited is a New Zealand-based consultancy shaping future-ready enterprise architectures and digital strategies.
        </p>

        <p class="contact">
            Inquiries: <a href="mailto:info@kenjishi.com">info@kenjishi.com</a>
        </p>
    </div>

</body>
</html>
